<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Core Ball</title>
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
    <link rel="stylesheet" href="style.css" />
    <style>
      #backToScarlet {
        position: fixed;
        top: 14px;
        left: 14px;
        z-index: 10000;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        border: 1px solid rgba(255,255,255,.24);
        border-radius: 10px;
        background: rgba(0,0,0,.78);
        color: #fff;
        font: 14px Arial, sans-serif;
        text-decoration: none;
        box-shadow: 0 4px 18px rgba(0,0,0,.3);
        -webkit-tap-highlight-color: transparent;
      }
      #backToScarlet:hover { background: rgba(30,45,75,.95); }
      #backToScarlet:focus-visible { outline: 2px solid #78a7ff; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <a id="backToScarlet" href="../index.html" aria-label="Back to Scarlet main page">&#8592; Back to Scarlet</a>
    <canvas style="display: none;" id="stage"></canvas>
    <div id="begin">
      <section class="center-box">
        <span class="title">Core Ball</span>
        <div class="button">
          <div id="txtAr">▶</div>
          <div class="text"></div>
        </div>
        <div class="op">
          <span id="btnFW"></span>
          <span id="btnReset"></span>
          <div id="tip"></div>
        </div>
      </section>
      <section id="wxArrow"></section>
    </div>
    <script type="text/javascript" src="index.js"></script>
  </body>
</html>
