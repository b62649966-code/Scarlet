<!DOCTYPE html>

  <style id="scarlet-back-button-style">
  #scarletBackButton {
    position: fixed !important;
    top: 16px !important;
    left: 16px !important;
    z-index: 2147483647 !important;
    display: inline-flex !important;
    align-items: center;
    gap: 8px;
    padding: 11px 17px;
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 10px;
    background: rgba(8,10,15,.92);
    color: #fff;
    font: 600 14px Arial, sans-serif;
    text-decoration: none;
    box-shadow: 0 5px 20px rgba(0,0,0,.4);
    cursor: pointer;
  }

  #scarletBackButton:hover {
    background: #2458a8;
    border-color: #6ca4ff;
  }

  #scarletBackButton:focus-visible {
    outline: 2px solid #78a7ff;
    outline-offset: 3px;
  }
</style>

  <body id="body">
<a id="scarletBackButton" href="../index.html" aria-label="Back to Scarlet">&#8592; Back to Scarlet</a>
    <div id="modal_parent">
      <div id="modal_content">
        <span id="modal_close_button">&times;</span>
        <div id="store_link_modal_content" class="modal_inner"></div>
        <div id="share_file_modal_content" class="modal_inner"></div>
      </div>
    </div>
    <div id="canvas_border" class="emscripten_border">
      <div id="play_content" class="middle center">
        <div class="edge">
          <div class="box">
            <div class="black">
              <img src="webapp/cover.jpg" class="cover" />
              <p class="title">Drive Mad</p>
              <p class="author">Martin Magni</p>
            </div>
          </div>
        </div>
        <div id="progress_or_play"><progress id="progress" class="loading" value="0" max="100"></progress></div>
        <p class="description"></p>
      </div>
      <canvas class="emscripten" id="canvas" tabindex="-1"></canvas>
      <div id="gradient"></div>
      <div id="webview_content"></div>
    </div>
    <script type="text/javascript" src="webapp/source_min.js"></script>
