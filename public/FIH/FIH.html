<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIH! — Custom Spinner</title>
  <style>
    :root {
      color-scheme: dark;
      --page-bg: #05070b;
      --glow: #0096ff;
      --fish-size: 300px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 76px 18px 28px;
      background: var(--page-bg);
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background-color .2s ease;
    }
    .back-btn {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 5;
      padding: 10px 18px;
      color: #fff;
      text-decoration: none;
      letter-spacing: 1px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,.22);
      background: rgba(255,255,255,.09);
    }
    .back-btn:hover { border-color: var(--glow); }
    .layout {
      width: min(100%, 940px);
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(260px, 320px);
      gap: 28px;
      align-items: center;
    }
    .stage {
      min-height: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 18px;
      background: rgba(255,255,255,.035);
    }
    .fish-wrapper {
      width: 100%;
      min-height: 330px;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1000px;
      cursor: pointer;
      padding: 20px;
    }
    .fish {
      display: block;
      width: var(--fish-size);
      max-width: 90%;
      max-height: 330px;
      object-fit: contain;
      image-rendering: pixelated;
      filter: drop-shadow(0 0 20px color-mix(in srgb, var(--glow) 65%, transparent));
      transform-style: preserve-3d;
      user-select: none;
      -webkit-user-drag: none;
    }
    h1 {
      margin: 0 0 18px;
      font-size: 1.6rem;
      letter-spacing: 4px;
      text-shadow: 0 0 14px var(--glow);
    }
    .hint { margin: -10px 0 20px; color: #aab5c4; font-size: .8rem; }
    .controls {
      padding: 20px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 16px;
      background: rgba(255,255,255,.07);
      box-shadow: 0 12px 35px rgba(0,0,0,.25);
    }
    .controls h2 {
      margin: 0 0 16px;
      font-size: 1rem;
      letter-spacing: 2px;
    }
    .control { margin: 0 0 16px; }
    .control label {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
      color: #dbe5f2;
      font-size: .78rem;
    }
    input[type="range"] { width: 100%; accent-color: var(--glow); }
    input[type="color"] {
      width: 100%;
      height: 36px;
      padding: 3px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
    }
    input[type="file"], input[type="url"], select {
      width: 100%;
      min-height: 38px;
      padding: 8px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 8px;
      background: #101722;
      color: #fff;
      font: inherit;
      font-size: .78rem;
    }
    .url-row { display: grid; gap: 8px; }
    button {
      min-height: 38px;
      padding: 9px 12px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 8px;
      background: rgba(0,150,255,.18);
      color: #fff;
      font: inherit;
      font-size: .76rem;
      cursor: pointer;
      transition: background .15s ease, border-color .15s ease;
    }
    button:hover { background: rgba(0,150,255,.32); border-color: var(--glow); }
    .button-row { display: flex; gap: 8px; }
    .button-row button { flex: 1; }
    .status {
      min-height: 1.2em;
      margin: 10px 0 0;
      color: #aab5c4;
      font-size: .7rem;
      line-height: 1.4;
    }
    @media (max-width: 720px) {
      body { align-items: flex-start; }
      .layout { grid-template-columns: 1fr; }
      .stage { min-height: 350px; }
      .fish-wrapper { min-height: 260px; }
      .fish { max-height: 250px; }
    }
  </style>
</head>
<body>
  <a href="../index.html" class="back-btn">&larr; BACK</a>

  <main class="layout">
    <section class="stage">
      <div class="fish-wrapper" id="fishWrapper" title="Click the image for an extra spin">
        <img id="fishElement" class="fish"
          src="https://codehs.com/uploads/317232f758f51a37476965a4034f3127"
          alt="Your spinning image" draggable="false">
      </div>
      <div>
        <h1>FIH!</h1>
        <p class="hint">Click your image for an extra spin</p>
      </div>
    </section>

    <section class="controls" aria-label="Image and animation settings">
      <h2>CUSTOMIZE FIH</h2>

      <div class="control">
        <label for="imageUpload">YOUR PNG</label>
        <input id="imageUpload" type="file" accept="image/png,.png">
      </div>

      <div class="control url-row">
        <label for="imageUrl">IMAGE URL (OPTIONAL)</label>
        <input id="imageUrl" type="url" placeholder="https://example.com/image.png">
        <button id="applyUrl" type="button">Use image URL</button>
      </div>

      <div class="control">
        <label for="sizeSlider"><span>IMAGE SIZE</span><output id="sizeValue">300 px</output></label>
        <input id="sizeSlider" type="range" min="80" max="600" value="300">
      </div>

      <div class="control">
        <label for="speedSlider"><span>SPIN SPEED</span><output id="speedValue">10</output></label>
        <input id="speedSlider" type="range" min="0" max="100" value="10">
      </div>

      <div class="control">
        <label for="axisSelect">ROTATION AXIS</label>
        <select id="axisSelect">
          <option value="Y">Y — side to side</option>
          <option value="X">X — top to bottom</option>
          <option value="Z">Z — flat spin</option>
        </select>
      </div>

      <div class="control">
        <label for="directionSelect">SPIN DIRECTION</label>
        <select id="directionSelect">
          <option value="1">Clockwise / forward</option>
          <option value="-1">Reverse</option>
        </select>
      </div>

      <div class="control">
        <label for="backgroundColor">BACKGROUND COLOR</label>
        <input id="backgroundColor" type="color" value="#05070b">
      </div>

      <div class="control">
        <label for="glowColor">IMAGE GLOW</label>
        <input id="glowColor" type="color" value="#0096ff">
      </div>

      <div class="button-row">
        <button id="resetButton" type="button">Reset settings</button>
        <button id="removeImage" type="button">Default image</button>
      </div>
      <p class="status" id="statusMessage" role="status">Settings are saved in this browser.</p>
    </section>
  </main>

  <script>
    (() => {
      const DEFAULT_IMAGE = 'https://codehs.com/uploads/317232f758f51a37476965a4034f3127';
      const STORAGE_KEY = 'scarlet-fih-settings-v2';
      const $ = id => document.getElementById(id);

      const fish = $('fishElement');
      const wrapper = $('fishWrapper');
      const upload = $('imageUpload');
      const imageUrl = $('imageUrl');
      const sizeSlider = $('sizeSlider');
      const speedSlider = $('speedSlider');
      const sizeValue = $('sizeValue');
      const speedValue = $('speedValue');
      const axisSelect = $('axisSelect');
      const directionSelect = $('directionSelect');
      const backgroundColor = $('backgroundColor');
      const glowColor = $('glowColor');
      const status = $('statusMessage');

      let rotation = 0;
      let speed = 10;
      let axis = 'Y';
      let direction = 1;
      let lastTime = performance.now();
      let customImage = null;

      function applySettings() {
        const size = Number(sizeSlider.value);
        speed = Number(speedSlider.value);
        axis = axisSelect.value;
        direction = Number(directionSelect.value);
        sizeValue.textContent = `${size} px`;
        speedValue.textContent = String(speed);
        document.documentElement.style.setProperty('--fish-size', `${size}px`);
        document.documentElement.style.setProperty('--page-bg', backgroundColor.value);
        document.documentElement.style.setProperty('--glow', glowColor.value);
      }

      function saveSettings() {
        try {
          const data = {
            size: sizeSlider.value,
            speed: speedSlider.value,
            axis: axisSelect.value,
            direction: directionSelect.value,
            background: backgroundColor.value,
            glow: glowColor.value,
            image: customImage
          };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
          status.textContent = 'Settings saved in this browser.';
        } catch (error) {
          status.textContent = 'Settings applied, but browser storage is full. Try a smaller PNG.';
        }
      }

      function setImage(source, persist = true) {
        fish.src = source;
        customImage = source === DEFAULT_IMAGE ? null : source;
        if (persist) saveSettings();
      }

      function loadSettings() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
          if (!saved) return;
          if (saved.size) sizeSlider.value = saved.size;
          if (saved.speed !== undefined) speedSlider.value = saved.speed;
          if (saved.axis && ['X', 'Y', 'Z'].includes(saved.axis)) axisSelect.value = saved.axis;
          if (saved.direction) directionSelect.value = saved.direction;
          if (saved.background) backgroundColor.value = saved.background;
          if (saved.glow) glowColor.value = saved.glow;
          if (typeof saved.image === 'string' && saved.image.startsWith('data:image/png')) {
            customImage = saved.image;
            fish.src = customImage;
          }
        } catch (error) {
          status.textContent = 'Could not load saved settings; defaults are active.';
        }
        applySettings();
      }

      function animate(now) {
        const delta = Math.min((now - lastTime) / 1000, 0.05);
        lastTime = now;
        rotation = (rotation + speed * 25 * direction * delta) % 360;
        fish.style.transform = `rotate${axis}(${rotation}deg)`;
        requestAnimationFrame(animate);
      }

      wrapper.addEventListener('click', () => {
        rotation += 360 * direction;
      });

      [sizeSlider, speedSlider, axisSelect, directionSelect, backgroundColor, glowColor]
        .forEach(control => {
          control.addEventListener('input', () => {
            applySettings();
            saveSettings();
          });
          control.addEventListener('change', () => {
            applySettings();
            saveSettings();
          });
        });

      upload.addEventListener('change', () => {
        const file = upload.files && upload.files[0];
        if (!file) return;
        if (file.type !== 'image/png' && !file.name.toLowerCase().endsWith('.png')) {
          status.textContent = 'Please choose a PNG image.';
          upload.value = '';
          return;
        }
        if (file.size > 3 * 1024 * 1024) {
          status.textContent = 'That PNG is over 3 MB. Choose a smaller image so it can be saved.';
          upload.value = '';
          return;
        }
        const reader = new FileReader();
        reader.onload = () => {
          if (typeof reader.result !== 'string') return;
          setImage(reader.result);
          status.textContent = 'Your PNG is applied and saved in this browser.';
        };
        reader.onerror = () => {
          status.textContent = 'Could not read that PNG. Try another file.';
        };
        reader.readAsDataURL(file);
      });

      $('applyUrl').addEventListener('click', () => {
        const value = imageUrl.value.trim();
        if (!value) {
          status.textContent = 'Paste an image URL first.';
          return;
        }
        try {
          const parsed = new URL(value);
          if (parsed.protocol !== 'https:' && parsed.protocol !== 'http:') throw new Error('Invalid protocol');
          fish.onerror = () => {
            status.textContent = 'Could not load that image URL.';
            fish.onerror = null;
          };
          fish.onload = () => {
            customImage = value;
            saveSettings();
            status.textContent = 'Image URL applied and saved.';
            fish.onload = null;
          };
          fish.src = value;
        } catch (error) {
          status.textContent = 'Enter a valid http or https image URL.';
        }
      });

      $('removeImage').addEventListener('click', () => {
        setImage(DEFAULT_IMAGE);
        upload.value = '';
        imageUrl.value = '';
        status.textContent = 'Default image restored.';
      });

      $('resetButton').addEventListener('click', () => {
        sizeSlider.value = '300';
        speedSlider.value = '10';
        axisSelect.value = 'Y';
        directionSelect.value = '1';
        backgroundColor.value = '#05070b';
        glowColor.value = '#0096ff';
        rotation = 0;
        applySettings();
        saveSettings();
      });

      fish.addEventListener('error', () => {
        status.textContent = 'Image could not be loaded. Choose a PNG from your device.';
      });

      loadSettings();
      applySettings();
      requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
